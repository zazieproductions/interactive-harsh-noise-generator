name: Deploy to GitHub Pages

# Publishes the single-file build to
#   https://zazieproductions.github.io/interactive-harsh-noise-generator/
# which is the link to hand to a phone. Runs on every push to `main`, so
# merging a PR *is* the deploy step. Can also be triggered by hand from the
# Actions tab.
#
# This is the *only* Pages workflow in the repository. A second one (the
# "Deploy Jekyll with GitHub Pages dependencies preinstalled" sample) builds
# the repository root with Jekyll and overwrites this deployment with a blank
# page — do not add it back.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a deployment in flight: a cancelled run leaves Pages pointing
  # at a half-published artifact.
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify engine + encoders
        run: npm run verify

      - name: Build
        run: npm run build

      # `enablement: true` asks GitHub to turn Pages on for the repository if it
      # is not enabled yet. Tokens without admin rights cannot do that, so the
      # step is allowed to fail: enable Pages once by hand
      # (Settings → Pages → Source: GitHub Actions) and re-run this workflow.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      # Pages has two build sources: "Deploy from a branch" (legacy — GitHub
      # runs Jekyll over the repository root) and "GitHub Actions" (serve the
      # artifact this workflow uploads). Only the second one can serve `dist/`.
      # On the legacy source GitHub publishes the *dev* `index.html` at the repo
      # root, whose `<script src="/src/main.tsx">` 404s → blank page, while every
      # workflow run still reports success. So check it here and stop the run
      # with instructions rather than deploying an artifact nobody will serve.
      #
      # The REST docs ask for `Administration: write` to change the source, but
      # the `pages: write` declared above is enough in practice — this step
      # flipped the repository from `legacy` to `workflow` unattended. If an org
      # policy ever refuses it, add a `PAGES_ADMIN_TOKEN` secret (fine-grained
      # PAT: Pages + Administration, read/write) and it will be used instead.
      - name: Point Pages at the GitHub Actions source
        env:
          GH_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN || github.token }}
        run: |
          pages="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages"
          auth=(-H "Accept: application/vnd.github+json"
                -H "Authorization: Bearer $GH_TOKEN"
                -H "Content-Type: application/json")
          fix="Settings → Pages → Build and deployment → Source: GitHub Actions"

          site=$(curl -s "${auth[@]}" "$pages")
          build_type=$(jq -r '.build_type // empty' <<<"$site")

          if [ -z "$build_type" ]; then
            echo "::error::Pages is not enabled on this repository. Turn it on: $fix"
            echo "#### ⚠️ Pages is not enabled" >> "$GITHUB_STEP_SUMMARY"
            echo "Enable it once — **$fix** — then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$build_type" = "workflow" ]; then
            echo "Pages deploys from GitHub Actions. ✓"
            exit 0
          fi

          echo "Pages build source is '$build_type'; trying to switch it to 'workflow'…"
          https_enforced=$(jq -r 'if .https_enforced == null then "true" else (.https_enforced | tostring) end' <<<"$site")
          if curl -sf -X PUT "${auth[@]}" "$pages" \
               -d "{\"build_type\":\"workflow\",\"https_enforced\":${https_enforced:-true}}" > /dev/null; then
            echo "Pages now serves the artifact this workflow uploads. ✓"
            exit 0
          fi

          # Legacy source: GitHub builds the repo root with Jekyll and serves
          # that, so uploading dist/ below would change nothing. Stop here.
          {
            echo "#### ⚠️ Pages is still building from the branch"
            echo ""
            echo "The source is \`$build_type\`, so GitHub serves a Jekyll build of the repository"
            echo "root (the dev \`index.html\`) and ignores this workflow's artifact. The token"
            echo "cannot change it — that needs \`Administration: write\`."
            echo ""
            echo "**Do this once: $fix**, then re-run the workflow."
            echo ""
            echo "To let the workflow do it for you, add a \`PAGES_ADMIN_TOKEN\` repository secret"
            echo "(fine-grained PAT with Pages + Administration, read and write)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Pages source is '$build_type'. Fix: $fix — then re-run this workflow."
          exit 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Catch the failure mode that is invisible from the Actions tab: a
      # deployment that "succeeded" but is not what is actually being served
      # (e.g. a legacy branch/Jekyll build of the repo root winning the race).
      - name: Verify the live site
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            html=$(curl -sfL "$URL" || true)
            case "$html" in
              *"NOISE WALL"*)
                if printf '%s' "$html" | grep -q '/src/main.tsx'; then
                  echo "::error::$URL is serving the dev index.html, not the build."
                  echo "Point Settings → Pages → Source at GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                fi
                echo "$URL is serving the production build."
                exit 0
                ;;
            esac
            echo "Attempt $attempt: site not ready yet, retrying in 10s…"
            sleep 10
          done
          echo "::error::$URL did not serve the app after 6 attempts."
          exit 1

      - name: Summarise
        run: |
          echo "### NOISE WALL is live" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Launch: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Open that URL on a phone and use “Add to Home Screen”." >> "$GITHUB_STEP_SUMMARY"
