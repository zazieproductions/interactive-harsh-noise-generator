name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, verify, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify engine + encoders
        run: npm run verify

      - name: Mount the UI in jsdom
        run: npm run smoke

      - name: Build single-file bundle
        run: npm run build

      - name: Report bundle size
        run: |
          echo "### Build artifact" >> "$GITHUB_STEP_SUMMARY"
          du -h dist/index.html | awk '{print "- dist/index.html: **" $1 "**"}' >> "$GITHUB_STEP_SUMMARY"
          ls -la dist >> "$GITHUB_STEP_SUMMARY"
